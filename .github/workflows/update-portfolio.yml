name: Update portfolio

on:
  schedule:
    - cron: "30 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-portfolio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and build
        env:
          PORTFOLIO_SOURCE_URL: ${{ secrets.PORTFOLIO_SOURCE_URL }}
          PORTFOLIO_SOURCE_URL_2: ${{ secrets.PORTFOLIO_SOURCE_URL_2 }}
        run: python update_portfolio.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "portfolio: $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
